# Publish MCP Server to the MCP Registry
# This workflow publishes the Maximo MCP server metadata to the
# official MCP Registry (https://registry.modelcontextprotocol.io)
# so it appears in VS Code Copilot's MCP server gallery and other MCP clients.
#
# Trigger: Manually via workflow_dispatch, or on npm version tag push.

name: Publish to MCP Registry

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write  # Required for GitHub OIDC auth with the MCP Registry

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mcp-publisher CLI
        run: |
          curl -L \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher --version

      - name: Authenticate with MCP Registry (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Validate server.json
        run: mcp-publisher validate

      - name: Publish to MCP Registry
        run: mcp-publisher publish
