<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b111a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16222e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4facfe;stop-opacity:1" />
    </linearGradient>
    <filter id="aiGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.1">
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
  </g>

  <!-- Inner Content Group (Slightly lowered to balance single line of text) -->
  <g transform="translate(256, 250)">
    
    <!-- Enterprise Gear -->
    <path d="M0 -150 L18 -150 L24 -120 L-24 -120 L-18 -150 Z" fill="#2d3e50" transform="rotate(0)"/>
    <path d="M0 -150 L18 -150 L24 -120 L-24 -120 L-18 -150 Z" fill="#2d3e50" transform="rotate(45)"/>
    <path d="M0 -150 L18 -150 L24 -120 L-24 -120 L-18 -150 Z" fill="#2d3e50" transform="rotate(90)"/>
    <path d="M0 -150 L18 -150 L24 -120 L-24 -120 L-18 -150 Z" fill="#2d3e50" transform="rotate(135)"/>
    <path d="M0 -150 L18 -150 L24 -120 L-24 -120 L-18 -150 Z" fill="#2d3e50" transform="rotate(180)"/>
    <path d="M0 -150 L18 -150 L24 -120 L-24 -120 L-18 -150 Z" fill="#2d3e50" transform="rotate(225)"/>
    <path d="M0 -150 L18 -150 L24 -120 L-24 -120 L-18 -150 Z" fill="#2d3e50" transform="rotate(270)"/>
    <path d="M0 -150 L18 -150 L24 -120 L-24 -120 L-18 -150 Z" fill="#2d3e50" transform="rotate(315)"/>
    <circle r="125" fill="#2d3e50"/>
    <circle r="105" fill="#0b111a"/>

    <!-- Neural Center (AI core) -->
    <g filter="url(#aiGlow)">
      <circle r="45" fill="url(#aiGrad)"/>
      <circle r="20" fill="white"/>
      
      <!-- Nodes -->
      <line x1="0" y1="0" x2="65" y2="-65" stroke="url(#aiGrad)" stroke-width="10"/>
      <line x1="0" y1="0" x2="-65" y2="-65" stroke="url(#aiGrad)" stroke-width="10"/>
      <line x1="0" y1="0" x2="65" y2="65" stroke="url(#aiGrad)" stroke-width="10"/>
      <line x1="0" y1="0" x2="-65" y2="65" stroke="url(#aiGrad)" stroke-width="10"/>
      
      <circle cx="65" cy="-65" r="18" fill="white"/>
      <circle cx="-65" cy="-65" r="18" fill="white"/>
      <circle cx="65" cy="65" r="18" fill="white"/>
      <circle cx="-65" cy="65" r="18" fill="white"/>
    </g>
  </g>

  <!-- Bottom Text (Clean single line) -->
  <text x="256" y="460" font-family="Arial, sans-serif" font-size="48" fill="white" text-anchor="middle" font-weight="900" letter-spacing="3">MAXIMO MCP</text>
</svg>
